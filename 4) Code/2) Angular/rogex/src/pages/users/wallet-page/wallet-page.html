<div class="container-lg pt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            @if (this.state.error||this.state.success) {
            @if (!this.state.error&&this.state.success) {
            <successful-action-component [message]="this.state.message"></successful-action-component>
            }@else {
            <unsuccessful-action-component [message]="this.state.message"></unsuccessful-action-component>
            }
            }

            <h1>Agregar wallet</h1>
            <form [formGroup]="createObjectForm" (ngSubmit)="createObject()">
                <div class="row mb-3">
                    <label for="inputEmail3" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" formControlName="name">
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="inputPassword3" class="col-sm-2 col-form-label">Fondos</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" formControlName="fund">
                    </div>
                </div>

                <div class="row mb-3 align-items-center">
                    <label class="col-sm-2 col-form-label">
                        Banco
                    </label>

                    <div class="col-sm-10">
                        <select class="form-select" formControlName="banck">
                            <option value="" disabled selected>Seleccionar</option>
                            <option value="BI">BI</option>
                            <option value="AZTECA">AZTECA</option>
                            <option value="PROMERICA">PROMERICA</option>
                            <option value="BANTRAB">BANTRAB</option>
                            <option value="BAC">BAC</option>
                        </select>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Agregar</button>
                </div>
            </form>
            <br>

            <h1>Editar Wallets</h1>
            <form [formGroup]="updateObjectForm" (ngSubmit)="updateObject()">

                <div class="row mb-3">
                    <label for="inputEmail3" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" formControlName="name">
                    </div>
                </div>

                <div class="row mb-3 align-items-center">
                    <label class="col-sm-2 col-form-label">
                        Banco
                    </label>

                    <div class="col-sm-10">
                        <select class="form-select" formControlName="banck">
                            <option value="" disabled selected>Seleccionar</option>
                            <option value="BI">BI</option>
                            <option value="AZTECA">AZTECA</option>
                            <option value="PROMERICA">PROMERICA</option>
                            <option value="BANTRAB">BANTRAB</option>
                            <option value="BAC">BAC</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="inputPassword3" class="col-sm-2 col-form-label">Nuevo fondo</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" formControlName="fund">
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
            <br>

            <h1>Tus Wallets</h1>
            <div class="row mb-3">

                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Banco</th>
                            <th scope="col">Fondos</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (wallet of this.state.data; track wallet.name) {
                        <tr>
                            <td>{{ wallet.name }}</td>
                            <td>{{ wallet.banck }}</td>
                            <td>{{ wallet.fund }}</td>
                        </tr>
                        }
                    </tbody>
                </table>

            </div>

        </div>
    </div>
</div>
