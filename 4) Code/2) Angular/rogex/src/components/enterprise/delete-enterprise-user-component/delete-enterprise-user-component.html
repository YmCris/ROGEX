<div class="container-lg pt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            @if (this.state.error && this.state.success) {
            @if (!this.state.error&&this.state.success) {
            <successful-action-component [message]="this.state.message"></successful-action-component>
            }@else {
            <unsuccessful-action-component [message]="this.state.message"></unsuccessful-action-component>
            }
            }

            <h1>Eliminar usuario de una empresa</h1>
            <form [formGroup]="deleteObjectForm" (ngSubmit)="deleteObject()">

                <div class="row mb-3">
                    <label for="inputEmail3" class="col-sm-2 col-form-label">Correo electrónico:</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" formControlName="email">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Eliminar</button>
            </form>
            <br>

        </div>
    </div>
</div>
