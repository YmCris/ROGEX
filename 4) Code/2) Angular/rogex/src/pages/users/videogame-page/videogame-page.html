<div class="container-lg">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            <app-get-videogame-multimedia-component [videogame]="videogame"></app-get-videogame-multimedia-component>
            <div class="container-lg py-5">

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-15">

                        <div class="card shadow-sm">

                            <div class="card-body p-4 p-lg-5">

                                <h1 class="fw-bold mb-3">
                                    {{ videogame?.title }}
                                </h1>

                                <div class="d-flex gap-3 mb-4">
                                    <span class="badge bg-secondary">
                                        {{ videogame?.enterpriseName }}
                                    </span>

                                    <span class="badge bg-warning text-dark">
                                        {{ videogame?.ageRating }}
                                    </span>
                                </div>

                                <div class="mb-4">
                                    <span class="fs-3 fw-bold text-success">
                                        Q{{ videogame?.price }}
                                    </span>
                                </div>

                                <div class="mb-4">
                                    <h5 class="fw-semibold">Sinopsis</h5>
                                    <p class="text-muted mb-0">
                                        {{ videogame?.description }}
                                    </p>
                                </div>

                                <div class="mb-4">
                                    <h5 class="fw-semibold">Requerimientos mínimos</h5>
                                    <p class="text-muted mb-0">
                                        {{ videogame?.minimumRequirements }}
                                    </p>
                                </div>

                                <hr>

                                @if (videogame && !videogame.suspensionOfSale) {
                                <button class="btn btn-primary" [routerLink]="[
                                    '/gamer/buy',
                                    videogame.title,
                                    videogame.enterpriseName
                                    ]">
                                    comprar
                                </button>
                                } @else {
                                <button class="btn btn-secondary btn-lg w-100" disabled>
                                    No disponible
                                </button>
                                }

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
<app-get-videogame-categories-component [videogame]="videogame"></app-get-videogame-categories-component>
