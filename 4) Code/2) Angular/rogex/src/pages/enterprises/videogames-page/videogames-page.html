<div class="container-lg pt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            @if (this.state.error||this.state.success) {
            @if (!this.state.error&&this.state.success) {
            <successful-action-component [message]="this.state.message"></successful-action-component>
            }@else {
            <unsuccessful-action-component [message]="this.state.message"></unsuccessful-action-component>
            }
            }
            <h1>Crear videojuego</h1>
            <form [formGroup]="createObjectForm" (ngSubmit)="createObject()">
                <div class="row mb-3">
                    <label for="inputEmail3" class="col-sm-2 col-form-label">Título</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" formControlName="title">
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="inputEmail3" class="col-sm-2 col-form-label">Descripción</label>
                    <div class="col-sm-10">
                        <textarea type="text" class="form-control" formControlName="description"></textarea>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="inputPassword3" class="col-sm-2 col-form-label">Precio</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" formControlName="price">
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="inputPassword3" class="col-sm-2 col-form-label">Requerimientos mínimos</label>
                    <div class="col-sm-10">
                        <textarea type="text" class="form-control" formControlName="minimumRequirements"></textarea>
                    </div>
                </div>

                <div class="row mb-3 align-items-center">
                    <label class="col-sm-2 col-form-label">
                        Restricción de edad
                    </label>

                    <div class="col-sm-10">
                        <select class="form-select" formControlName="ageRating">
                            <option value="" disabled selected>Seleccionar</option>
                            <option value="E">E</option>
                            <option value="T">T</option>
                            <option value="M">M</option>
                        </select>
                    </div>
                </div>

                <fieldset class="row mb-3">
                    <legend class="col-form-label col-sm-2 pt-0">Suspender venta</legend>
                    <div class="col-sm-10">
                        <div class="form-check form-switch pt-2">
                            <input class="form-check-input" type="checkbox" formControlName="suspensionOfSale">

                        </div>
                    </div>
                </fieldset>

                <fieldset class="row mb-3">
                    <legend class="col-form-label col-sm-2 pt-0">Ocultar comentarios</legend>
                    <div class="col-sm-10">
                        <div class="form-check form-switch pt-2">
                            <input class="form-check-input" type="checkbox" formControlName="hiddenComments">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="row mb-3">
                    <legend class="col-form-label col-sm-2 pt-0">Ocultar videojuego</legend>
                    <div class="col-sm-10">
                        <div class="form-check form-switch pt-2">
                            <input class="form-check-input" type="checkbox" formControlName="hidden">
                        </div>
                    </div>
                </fieldset>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Crear</button>
                </div>
            </form>
            <br>
